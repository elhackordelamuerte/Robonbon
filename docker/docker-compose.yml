# Launch:
#   xhost +local:docker            # once per session (X11 access)
#   cp .env.example .env           # once, then edit it (sim or real arm)
#   docker compose up -d control viz
#
# RViz runs INSIDE the control container (X11 forwarded), so on the internal
# DDS network - no need for --network host:
#   docker compose exec control bash -lc "source /ros2_ws/install/setup.bash && rviz2 -d /ros2_ws/so101.rviz"
#
# ROS_DOMAIN_ID (set in .env) isolates groups sharing a machine.

name: tek5

# Shared ROS environment for all services.
x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  FASTDDS_BUILTIN_TRANSPORTS: LARGE_DATA

services:
  control:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control
    image: tek5/control
    init: true
    environment:
      <<: *ros-env
      USE_SIM: ${USE_SIM:-true}
      # Position du plateau d'échecs : coin extérieur de a1 dans le repère du bras (m, °)
      BOARD_X: ${BOARD_X:-0.10}
      BOARD_Y: ${BOARD_Y:-0.10}
      BOARD_YAW: ${BOARD_YAW:--90}
      REAL_ROBOT_PORT: ${REAL_ROBOT_PORT:-/dev/ttyACM0}
      MUJOCO_GL: osmesa
      DISPLAY: ${DISPLAY}
      QT_QPA_PLATFORM: xcb        # robust X11 and XWayland
    device_cgroup_rules:  # Grant permissions to access usb serial devices (real arm)
      - 'c 166:* rmw'
      - 'c 188:* rmw'
      - 'c 81:* rmw'
    volumes:
      - ../ros2_ws:/ros2_ws
      - /dev:/dev
      - ../sim:/opt/so101/sim
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./control_entrypoint.sh:/opt/so101/entrypoint.sh:ro
      - ${CALIBRATION_FILE:-/dev/null}:/calibration/arm.json:ro
    networks: [rosnet]
    # Caméra : /dev est monté et la règle 'c 81:* rmw' autorise les /dev/videoN,
    # pas de "devices:" sinon le conteneur refuse de démarrer quand la caméra est absente.
    stdin_open: true
    tty: true
    # Only container that builds (concurrent colcon on the same volume = conflicts).
    # viz waits for install/ to be ready.
    command: ["/opt/so101/entrypoint.sh"]

  # robot_state_publisher: publishes /robot_description and the TFs from
  # /joint_states (provided by your driver_node). Visualization is done
  # with RViz from the control container.
  viz:
    image: tek5/control
    init: true
    environment: *ros-env
    volumes:
      - ../ros2_ws:/ros2_ws
    networks: [rosnet]
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash &&
      until [ -f /ros2_ws/install/setup.bash ] && [ -f /ros2_ws/install/so101_description/share/so101_description/launch/viz.launch.py ]; do echo 'waiting for build (control)...'; sleep 1; done &&
      cd /ros2_ws && source install/setup.bash &&
      ros2 launch so101_description viz.launch.py"

  # Échiquier : YOLO + plateau -> /chess/state (so101_perception/chess_perception_node.py).
  # Activé seulement si docker/.env contient COMPOSE_PROFILES=perception.
  # ultralytics n'est pas dans l'image (Dockerfile.perception inchangé) : installé au premier
  # lancement dans le volume yolo_pkgs, puis réutilisé.
  # Pas de colcon ici (le build est fait par control) : le paquet est lancé depuis les sources.
  perception:
    profiles: [perception]
    build:
      context: ..
      dockerfile: docker/Dockerfile.perception
    image: tek5/perception
    init: true
    environment:
      <<: *ros-env
      PYTHONPATH: /opt/yolo
    volumes:
      - ../ros2_ws:/ros2_ws
      - ../runs:/runs                 # poids YOLO (runs/detect/...) et sortie runs/scene/latest.*
      - ../images:/images:ro          # photos de test (PERCEPTION_SOURCE=/images/image2.jpg)
      - yolo_pkgs:/opt/yolo
      - /dev:/dev                     # caméra si présente (DroidCam), sans bloquer le démarrage
    device_cgroup_rules:
      - 'c 81:* rmw'                  # périphériques vidéo /dev/videoN
    networks: [rosnet]
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash &&
      if ! python3 -c 'import ultralytics' 2>/dev/null; then
      echo 'installation de ultralytics (premier lancement)...' &&
      pip install --break-system-packages --no-cache-dir --target /opt/yolo
      --extra-index-url https://download.pytorch.org/whl/cpu
      torch torchvision matplotlib polars scipy pyyaml requests psutil pillow &&
      pip install --break-system-packages --no-cache-dir --target /opt/yolo --no-deps ultralytics ultralytics-thop;
      fi &&
      cd /ros2_ws/src/so101_perception &&
      python3 -m so101_perception.chess_perception_node --ros-args
      -p source:=${PERCEPTION_SOURCE:-/dev/video0}
      -p weights:=${YOLO_WEIGHTS:-/runs/detect/train-17/weights/best.pt}
      -p conf:=${YOLO_CONF:-0.25}
      -p flip:=${PERCEPTION_FLIP:-false}
      -p marker_size:=${MARKER_SIZE:-0.08}
      -p marker_x:=${MARKER_X:-0.10}
      -p marker_y:=${MARKER_Y:-0.0}
      -p marker_yaw:=${MARKER_YAW:-0.0}"

networks:
  rosnet:
    driver: bridge

volumes:
  yolo_pkgs:
