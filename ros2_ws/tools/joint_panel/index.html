<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilotage SO-ARM101</title>
<style>
  :root { --fond:#f5f6f8; --carte:#fff; --texte:#1c2330; --doux:#6b7280; --bord:#e3e6eb; --accent:#2563eb; --danger:#dc2626; --ok:#16a34a; }
  @media (prefers-color-scheme: dark) { :root { --fond:#12151b; --carte:#1b2029; --texte:#e6e9ef; --doux:#9aa3b2; --bord:#2b3240; --accent:#60a5fa; --danger:#f87171; --ok:#4ade80; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--fond); color:var(--texte); }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:1fr 1fr; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  header { max-width:1100px; margin:0 auto; padding:16px 16px 0; display:flex; align-items:center; gap:12px; }
  h1 { font-size:18px; margin:0; } h2 { font-size:15px; margin:0 0 12px; }
  .carte { background:var(--carte); border:1px solid var(--bord); border-radius:10px; padding:16px; }
  .pleine { grid-column:1 / -1; }
  .joint { display:grid; grid-template-columns:110px 1fr 72px 60px; gap:8px; align-items:center; margin-bottom:8px; }
  .joint label { font-weight:600; } .mesure { color:var(--doux); font-variant-numeric:tabular-nums; text-align:right; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=number], input[type=text] { width:100%; padding:5px 6px; border:1px solid var(--bord); border-radius:6px; background:var(--fond); color:var(--texte); }
  button { padding:6px 10px; border:1px solid var(--bord); border-radius:6px; background:var(--fond); color:var(--texte); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primaire { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); }
  .barre { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  ul { list-style:none; margin:0; padding:0; } li { display:flex; gap:6px; align-items:center; padding:6px 0; border-bottom:1px solid var(--bord); }
  li .nom { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li input[type=number] { width:70px; }
  .vide { color:var(--doux); font-style:italic; }
  pre { margin:0; padding:10px; background:var(--fond); border-radius:6px; overflow-x:auto; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .pastille { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--bord); color:var(--doux); }
  .pastille.actif { color:var(--ok); border-color:var(--ok); }
</style>
</head>
<body>
<header>
  <h1>Pilotage SO-ARM101</h1>
  <span id="connexion" class="pastille">…</span>
  <span id="lecture" class="pastille">à l'arrêt</span>
</header>
<main>
  <section class="carte">
    <h2>Joints <small class="vide">(rad, pince 0-100 %)</small></h2>
    <div id="joints"></div>
    <div class="barre">
      <label><input type="checkbox" id="direct" checked> Envoi direct</label>
      <button class="primaire" id="envoyer">Envoyer</button>
      <button id="copier">← Position actuelle</button>
      <button id="accueil">Position zéro</button>
    </div>
  </section>

  <section class="carte">
    <h2>Poses enregistrées</h2>
    <div class="barre" style="margin-top:0;margin-bottom:10px">
      <input type="text" id="nom-pose" placeholder="Nom de la pose (ex. approche)" style="flex:1">
      <button class="primaire" id="sauver-pose">Enregistrer</button>
    </div>
    <ul id="poses"></ul>
  </section>

  <section class="carte">
    <h2>Séquence (animation)</h2>
    <ul id="sequence"></ul>
    <div class="barre">
      <label><input type="checkbox" id="boucle"> Boucle</label>
      <button class="primaire" id="jouer">▶ Jouer</button>
      <button class="danger" id="stop">■ Stop</button>
      <button id="vider">Vider</button>
    </div>
    <div class="barre">
      <input type="text" id="nom-sequence" placeholder="Nom de la séquence" style="flex:1">
      <button id="sauver-sequence">Enregistrer</button>
    </div>
    <ul id="sequences" style="margin-top:8px"></ul>
  </section>

  <section class="carte">
    <h2>Commande ROS 2 équivalente</h2>
    <pre id="commande"></pre>
    <div class="barre"><button id="copier-commande">Copier</button></div>
  </section>
</main>

<script>
const JOINTS = ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll", "gripper"];
const INTERVALLE_ETAT_MS = 200, INTERVALLE_DIRECT_MS = 100;
let limites = {}, etat = {}, donnees = { poses: {}, sequences: {} }, sequence = [];
const $ = (id) => document.getElementById(id);

async function api(chemin, corps) {
  const options = corps === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corps) };
  const reponse = await fetch(chemin, options);
  if (!reponse.ok) throw new Error((await reponse.json()).erreur || reponse.status);
  return reponse.json();
}

function element(balise, props = {}, enfants = []) {
  const el = Object.assign(document.createElement(balise), props);
  enfants.forEach((e) => el.append(e));
  return el;
}

// ---- Joints
function construireJoints() {
  JOINTS.forEach((nom) => {
    const [bas, haut] = limites[nom];
    const pas = nom === "gripper" ? 1 : 0.01;
    const curseur = element("input", { type: "range", min: bas, max: haut, step: pas, value: 0, id: `r-${nom}` });
    const champ = element("input", { type: "number", min: bas, max: haut, step: pas, value: 0, id: `n-${nom}` });
    curseur.oninput = () => { champ.value = curseur.value; modifie(); };
    champ.onchange = () => { champ.value = Math.min(Math.max(+champ.value, bas), haut); curseur.value = champ.value; modifie(); };
    $("joints").append(element("div", { className: "joint" }, [
      element("label", { textContent: nom, htmlFor: `r-${nom}` }), curseur, champ,
      element("span", { className: "mesure", id: `m-${nom}`, textContent: "–" }),
    ]));
  });
}

const lireConsigne = () => Object.fromEntries(JOINTS.map((n) => [n, +$(`n-${n}`).value]));
function ecrireConsigne(joints) {
  Object.entries(joints).forEach(([n, v]) => { if ($(`n-${n}`)) { $(`n-${n}`).value = (+v).toFixed(n === "gripper" ? 0 : 2); $(`r-${n}`).value = v; } });
  majCommande();
}

let dernierEnvoi = 0, envoiPrevu = null;
function modifie() {
  majCommande();
  if (!$("direct").checked) return;
  const attente = INTERVALLE_DIRECT_MS - (Date.now() - dernierEnvoi);
  clearTimeout(envoiPrevu);
  envoiPrevu = setTimeout(envoyer, Math.max(attente, 0));
}
function envoyer() { dernierEnvoi = Date.now(); api("/api/commande", { joints: lireConsigne() }).catch(alerte); }

function majCommande() {
  const c = lireConsigne();
  $("commande").textContent = `ros2 topic pub -r 10 --times 10 /joint_command sensor_msgs/msg/JointState \\\n  "{name: [${JOINTS.join(", ")}], position: [${JOINTS.map((n) => n === "gripper" ? c[n].toFixed(1) : c[n].toFixed(2)).join(", ")}]}"`;
}

// ---- État mesuré
async function rafraichirEtat() {
  try {
    const r = await api("/api/etat");
    etat = r.etat;
    JOINTS.forEach((n) => { $(`m-${n}`).textContent = n in etat ? etat[n].toFixed(n === "gripper" ? 0 : 2) : "–"; });
    const recu = Object.keys(etat).length > 0;
    $("connexion").textContent = recu ? "driver connecté" : "en attente de /joint_states";
    $("connexion").classList.toggle("actif", recu);
    $("lecture").textContent = r.en_lecture ? "lecture en cours" : "à l'arrêt";
    $("lecture").classList.toggle("actif", r.en_lecture);
  } catch { $("connexion").textContent = "panneau injoignable"; $("connexion").classList.remove("actif"); }
}

// ---- Poses et séquences (persistées dans poses.json)
const sauver = () => api("/api/poses", donnees).catch(alerte);

function afficherPoses() {
  const liste = $("poses"); liste.replaceChildren();
  const noms = Object.keys(donnees.poses);
  if (!noms.length) liste.append(element("li", { className: "vide", textContent: "Aucune pose : règle les joints puis « Enregistrer »." }));
  noms.forEach((nom) => liste.append(element("li", {}, [
    element("span", { className: "nom", textContent: nom, title: JSON.stringify(donnees.poses[nom]) }),
    element("button", { textContent: "Aller", onclick: () => { ecrireConsigne(donnees.poses[nom]); envoyer(); } }),
    element("button", { textContent: "+ Séquence", onclick: () => { sequence.push({ pose: nom, duree: 1.5 }); afficherSequence(); } }),
    element("button", { className: "danger", textContent: "✕", title: "Supprimer", onclick: () => { delete donnees.poses[nom]; sauver(); afficherPoses(); } }),
  ])));
}

function afficherSequence() {
  const liste = $("sequence"); liste.replaceChildren();
  if (!sequence.length) liste.append(element("li", { className: "vide", textContent: "Ajoute des poses avec « + Séquence »." }));
  sequence.forEach((etape, i) => {
    const duree = element("input", { type: "number", min: 0.1, step: 0.1, value: etape.duree, title: "Durée (s)" });
    duree.onchange = () => { etape.duree = Math.max(+duree.value, 0.1); };
    liste.append(element("li", {}, [
      element("span", { className: "nom", textContent: `${i + 1}. ${etape.pose}` }), duree, element("span", { className: "vide", textContent: "s" }),
      element("button", { textContent: "↑", disabled: i === 0, onclick: () => { [sequence[i - 1], sequence[i]] = [sequence[i], sequence[i - 1]]; afficherSequence(); } }),
      element("button", { className: "danger", textContent: "✕", onclick: () => { sequence.splice(i, 1); afficherSequence(); } }),
    ]));
  });
}

function afficherSequences() {
  const liste = $("sequences"); liste.replaceChildren();
  Object.keys(donnees.sequences).forEach((nom) => liste.append(element("li", {}, [
    element("span", { className: "nom", textContent: `🎬 ${nom}` }),
    element("button", { textContent: "Charger", onclick: () => { sequence = structuredClone(donnees.sequences[nom]); afficherSequence(); } }),
    element("button", { className: "danger", textContent: "✕", onclick: () => { delete donnees.sequences[nom]; sauver(); afficherSequences(); } }),
  ])));
}

function alerte(erreur) { $("connexion").textContent = `erreur : ${erreur.message}`; $("connexion").classList.remove("actif"); }

// ---- Boutons
$("envoyer").onclick = envoyer;
$("copier").onclick = () => ecrireConsigne(etat);
$("accueil").onclick = () => { ecrireConsigne(Object.fromEntries(JOINTS.map((n) => [n, 0]))); envoyer(); };
$("sauver-pose").onclick = () => {
  const nom = $("nom-pose").value.trim() || `pose ${Object.keys(donnees.poses).length + 1}`;
  donnees.poses[nom] = lireConsigne(); $("nom-pose").value = ""; sauver(); afficherPoses();
};
$("jouer").onclick = () => {
  const manquantes = sequence.filter((e) => !donnees.poses[e.pose]);
  if (!sequence.length || manquantes.length) return alerte(new Error(sequence.length ? "pose supprimée dans la séquence" : "séquence vide"));
  api("/api/lecture", { boucle: $("boucle").checked, poses: sequence.map((e) => ({ joints: donnees.poses[e.pose], duree: e.duree })) }).catch(alerte);
};
$("stop").onclick = () => api("/api/stop", {}).catch(alerte);
$("vider").onclick = () => { sequence = []; afficherSequence(); };
$("sauver-sequence").onclick = () => {
  if (!sequence.length) return;
  const nom = $("nom-sequence").value.trim() || `séquence ${Object.keys(donnees.sequences).length + 1}`;
  donnees.sequences[nom] = structuredClone(sequence); $("nom-sequence").value = ""; sauver(); afficherSequences();
};
$("copier-commande").onclick = () => navigator.clipboard.writeText($("commande").textContent);

(async () => {
  const r = await api("/api/etat");
  limites = r.limites;
  construireJoints();
  donnees = await api("/api/poses");
  afficherPoses(); afficherSequence(); afficherSequences(); majCommande();
  await rafraichirEtat();
  if (Object.keys(etat).length) ecrireConsigne(etat);  // sliders = position réelle au démarrage
  setInterval(rafraichirEtat, INTERVALLE_ETAT_MS);
})();
</script>
</body>
</html>
